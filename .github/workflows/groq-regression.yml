name: Groq failover and game regression
on:
  push:
    branches: [main]
    paths:
      - 'server/groq.cjs'
      - 'qa/server-audit.cjs'
      - 'test-world.cjs'
      - 'qa/principles.cjs'
      - '.github/workflows/groq-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-groq-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test server rate-limit and key failover invariants
        run: node qa/server-audit.cjs
      - name: Run all game tests
        run: npm test
      - name: Verify deployment build
        run: npm run build
